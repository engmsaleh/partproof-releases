name: Bug report
description: PartProof did something unexpected
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting!

        **The fastest way to file this:** click *Report Bug* inside the
        PartProof task pane in SOLIDWORKS — it auto-fills your version,
        channel, SOLIDWORKS version, and OS into the form. You only have
        to write what happened.

        **Privacy reminder:** GitHub issues are public. If you paste a
        diagnostic bundle from the addin's *Copy Bundle* button, redact
        anything you wouldn't want public (file paths, transcripts, CAD
        parameter values).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe what you were trying to do, what you saw, and how we can reproduce it.
        Include any screenshots, prompts, or addin log lines that might help.
      placeholder: |
        Replace this with the actual description.

        **What I was trying to do:**

        **What happened instead:**

        **How to reproduce (if you can):**
    validations:
      required: true
